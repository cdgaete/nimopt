name: chatbot

on: workflow_dispatch

jobs:
  needle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LLAMA: b10794
      MODEL_URL: https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4

      - name: install llama-server
        run: |
          curl -sL -o /tmp/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA/llama-$LLAMA-bin-ubuntu-x64.tar.gz"
          mkdir -p "$HOME/llama.cpp/$LLAMA"
          tar xzf /tmp/llama.tar.gz -C "$HOME/llama.cpp/$LLAMA" --strip-components 1
          echo "$HOME/llama.cpp/$LLAMA" >> "$GITHUB_PATH"
          echo "MODEL=$HOME/models/Qwen_Qwen3.5-4B-Q4_K_M.gguf" >> "$GITHUB_ENV"

      - name: model cache
        id: model
        uses: actions/cache@v4
        with:
          path: ~/models
          key: gguf-qwen3.5-4b-q4_k_m

      - name: download the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$MODEL")"
          curl -sL -o "$MODEL" "$MODEL_URL"

      - name: regenerate the corpus
        run: node website/scripts/llms.mjs

      - name: slot cache
        id: slot
        uses: actions/cache@v4
        with:
          path: website/scripts/cache
          key: slot-${{ env.LLAMA }}-${{ hashFiles('website/static/llms-full.txt', 'website/scripts/serve.sh') }}

      - name: serve
        run: |
          cd website
          THREADS=4 MODEL="$MODEL" scripts/serve.sh > /tmp/llama.log 2>&1 &
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)
            [ "$code" = 200 ] && exit 0
            sleep 1
          done
          cat /tmp/llama.log
          exit 1

      - name: warm
        timeout-minutes: 280
        working-directory: website
        run: |
          if [ "${{ steps.slot.outputs.cache-hit }}" = "true" ]; then
            scripts/chatbot.py warm --restore
          else
            scripts/chatbot.py warm
          fi

      - name: needle
        timeout-minutes: 60
        working-directory: website
        run: scripts/chatbot.py needle --count 3 --max-tokens 48

      - name: ask
        working-directory: website
        run: scripts/chatbot.py ask --max-tokens 48 "What does absent() report, and which page documents it?"
