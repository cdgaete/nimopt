name: gams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/nimopt/solvers/**"
      - "tests/test_gams.py"
      - ".github/workflows/gams.yml"
  pull_request:
    paths:
      - "src/nimopt/solvers/**"
      - "tests/test_gams.py"
      - ".github/workflows/gams.yml"

permissions:
  contents: read

env:
  GAMS: https://d37drm4t2jghv5.cloudfront.net/distributions/54.6.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: GAMS with its demo license, Linux
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sfL -o gams.exe "$GAMS/linux/linux_x64_64_sfx.exe"
          chmod +x gams.exe
          ./gams.exe > /dev/null
          echo "$RUNNER_TEMP/gams54.6_linux_x64_64_sfx" >> "$GITHUB_PATH"

      - name: GAMS with its demo license, macOS
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sfL -o gams.pkg "$GAMS/macosx_arm64/GAMS54.6.0.pkg"
          sudo installer -pkg gams.pkg -target /
          echo "/Library/Frameworks/GAMS.framework/Resources" >> "$GITHUB_PATH"

      - name: GAMS with its demo license, Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:GAMS/windows/windows_x64_64.exe" -OutFile "$env:RUNNER_TEMP\gams.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\gams.exe" -ArgumentList "/SP-", "/VERYSILENT", "/NORESTART", "/currentUser", "/noIcons", "/desktopIcons=no", "/DIR=C:\GAMS\54"
          "C:\GAMS\54" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: the GAMS license and release
        shell: bash
        working-directory: ${{ runner.temp }}
        run: gams | grep -E "Release|License|Demo"

      - name: the gams adapter tests
        shell: bash
        run: uv run --python 3.13 --extra highs --with pytest pytest tests/test_gams.py -rs
