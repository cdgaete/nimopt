[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nimopt"
version = "0.2.0"
description = "Algebraic optimization modeling with lazy constraint expansion, powered by nimblend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "nimblend",
    "nimopt_rust",
]
authors = [
    {name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com"}
]
keywords = ["optimization", "linear-programming", "modeling", "operations-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/cdgaete/nimopt"
Documentation = "https://github.com/cdgaete/nimopt#readme"
Repository = "https://github.com/cdgaete/nimopt"
Issues = "https://github.com/cdgaete/nimopt/issues"

[project.optional-dependencies]
highs = ["highspy>=1.5.0"]
pdlp = ["ortools>=9.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0",
    "highspy>=1.5.0",
    "ortools>=9.0",
]
all = ["highspy>=1.5.0", "ortools>=9.0"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
