repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: .venv/bin/ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        always_run: true

      - id: playground-wheel
        name: playground wheel
        entry: bash -c 'rm -f website/static/wheels/nimopt-*.whl && uv build --wheel -q -o website/static/wheels'
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
